services:
  k6:
    image: grafana/k6:latest
    profiles: [ tools ]
    environment:
      BASE_URL: ${BASE_URL:-http://api:8000}
      VUS: ${VUS:-5}
      DURATION: ${DURATION:-30s}
    volumes:
      - ./k6:/scripts:ro
    entrypoint: [ "k6" ]


  api-python:
    build: ./services/python
    environment:
      UVICORN_HOST: ${PYTHON_UVICORN_HOST:-0.0.0.0}
      UVICORN_PORT: ${PYTHON_UVICORN_PORT:-8000}
      UVICORN_WORKERS: ${PYTHON_UVICORN_WORKERS:-1}
      UVICORN_LOOP: ${PYTHON_UVICORN_LOOP:-auto}
      UVICORN_HTTP: ${PYTHON_UVICORN_HTTP:-auto}
      UVICORN_LOG_LEVEL: ${PYTHON_UVICORN_LOG_LEVEL:-warning}
      UVICORN_ACCESS_LOG: ${PYTHON_UVICORN_ACCESS_LOG:-false}
      UVICORN_RELOAD: ${PYTHON_UVICORN_RELOAD:-false}
    ports:
      - "8001:8000"


  api-go:
    build: ./services/go
    ports:
      - "8002:8000"


  api-java:
    build: ./services/java
    ports:
      - "8003:8080"

  api-rust:
    build: ./services/rust
    ports:
      - "8004:8000"


